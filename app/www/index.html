<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>News Lens</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8f2; --fg: #1d1b18; --muted: #7a7368; --line: #ddd6ca; --accent: #1f6f6b; --icon: #1f6f6b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1916; --fg: #e8e3da; --muted: #9a9387; --line: #3a372f; --icon: #5fb8b0; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  /* Solid strip behind the status bar so the list scrolls under it, not through it. */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top);
                 background: var(--bg); z-index: 1; }
  h1 { font: 700 28px Georgia, serif; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  .field { flex: 1; min-width: 0; position: relative; display: flex; }
  /* 17px keeps iOS from zooming the page when the field is focused. */
  input { flex: 1; min-width: 0; font-size: 17px; padding: 12px 38px 12px 12px; border-radius: 10px; border: 1px solid var(--line);
          background: transparent; color: inherit; -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; border-color: var(--accent); }
  .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0;
           border-radius: 14px; background: var(--line); color: var(--icon); font-size: 14px; font-weight: 600; line-height: 28px; }
  .clear[hidden] { display: none; }
  .go { width: 52px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .hint { margin: 8px 2px 0; font-size: 14px; color: #b3261e; min-height: 0; }
  .hint:empty { display: none; }
  button { font-size: 17px; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0 -16px; }
  /* Each row slides left over a red Delete action, like Mail. */
  .row { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); transition: max-height .25s ease, opacity .25s ease; max-height: 80px; }
  .row.gone { max-height: 0; opacity: 0; border-bottom-width: 0; }
  .row a { position: relative; z-index: 1; display: block; padding: 12px 16px; background: var(--bg); color: inherit; text-decoration: none;
           transition: transform .25s cubic-bezier(.2,.9,.2,1); touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .row a.dragging { transition: none; }
  .row small { display: block; font-size: 12px; color: var(--muted); }
  .row .del { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; padding: 0; border-radius: 0; background: #e5383b; color: #fff;
              display: flex; justify-content: flex-end; align-items: center; }
  /* The trash icon sits centred in the 88px a swipe reveals. */
  .row .del span { width: 88px; display: flex; justify-content: center; align-items: center; }
  .empty { color: var(--muted); font-size: 15px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); display: flex; align-items: center; gap: 12px;
           padding: 12px 12px 12px 16px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 15px; z-index: 2; }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Undo in the warm grey family, lightened to read on the dark bar. */
  .toast button { padding: 8px 10px; font-size: 15px; background: none; color: #d9d2c5; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<h1>News Lens</h1>
<p class="sub">Open a news page, then tap Filter to read just the text you want.</p>
<!-- A plain text field with the URL keyboard: type="url" would make the browser refuse
     "ndtv.com" (no https://) and silently swallow the Go. -->
<form id="go" novalidate>
  <div class="field">
    <input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="none" autocorrect="off"
           autocomplete="off" spellcheck="false" placeholder="ndtv.com or any article URL" aria-label="Site or article address">
    <button type="button" class="clear" id="clear" aria-label="Clear" hidden>✕</button>
  </div>
  <button type="submit" class="go" aria-label="Go"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
</form>
<p class="hint" id="hint" role="status"></p>
<h2>Your sites</h2>
<!-- Filled from the saved list (seeded with SEED_SITES on first launch). -->
<ul id="sites"></ul>
<p class="empty" id="empty" hidden>No sites yet. Type one above and it'll be added here.</p>
<div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="undo">Undo</button></div>
<script>
  var field = document.getElementById('url');
  var clear = document.getElementById('clear');
  var hint = document.getElementById('hint');

  // What the user typed as an address: "ndtv.com", "www.ndtv.com/india", a full URL,
  // or a bare name ("ndtv" becomes ndtv.com). Returns null for anything else.
  function toURL(text) {
    text = text.trim();
    if (!text || /\s/.test(text)) return null;
    if (!/^https?:\/\//i.test(text)) {
      if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return null; // mailto:, javascript:, ...
      if (!/\./.test(text.split('/')[0])) text = text.replace(/^([^/]+)/, '$1.com');
      text = 'https://' + text;
    }
    try {
      var u = new URL(text);
      return /\./.test(u.hostname) ? u.href : null;
    } catch (e) {
      return null;
    }
  }

  // ---- Your sites: a list kept on this device, keyed by hostname without "www.". ----
  var SEED_SITES = [
    ['NDTV India', 'https://www.ndtv.com/india'],
    ['The Hindu', 'https://www.thehindu.com/news/national/'],
    ['Indian Express', 'https://indianexpress.com/section/india/'],
    ['The Guardian', 'https://www.theguardian.com/world'],
    ['AP News', 'https://apnews.com/world-news'],
    ['CNN', 'https://edition.cnn.com/world'],
    ['BBC News', 'https://www.bbc.com/news'],
    ['Reuters', 'https://www.reuters.com/world/'],
    ['The New York Times', 'https://www.nytimes.com/section/world'],
    ['The Washington Post', 'https://www.washingtonpost.com/world/'],
    ['Al Jazeera', 'https://www.aljazeera.com/news/'],
    ['NPR', 'https://www.npr.org/sections/news/'],
    ['Times of India', 'https://timesofindia.indiatimes.com/india'],
    ['Hindustan Times', 'https://www.hindustantimes.com/india-news'],
    ['India Today', 'https://www.indiatoday.in/india'],
    ['The Verge', 'https://www.theverge.com/tech'],
  ];
  var STORE = 'newslens:sites';
  var TRASH = '<span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path>' +
    '<path d="M6 6l1 14h10l1-14"></path><path d="M10 11v6M14 11v6"></path></svg></span>';
  var list = document.getElementById('sites');

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  function loadSites() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (Array.isArray(saved)) return saved;
    } catch (e) { /* fall through to the seed */ }
    return SEED_SITES.map(function (s) { return { name: s[0], url: s[1], host: hostOf(s[1]) }; });
  }
  var sites = loadSites();

  function saveSites() {
    try { localStorage.setItem(STORE, JSON.stringify(sites)); } catch (e) { /* storage blocked */ }
  }

  function render() {
    list.innerHTML = sites.map(function (s, i) {
      return '<li class="row" data-i="' + i + '"><button type="button" class="del" tabindex="-1" aria-label="Delete">' + TRASH + '</button>' +
        '<a href="' + esc(s.url) + '">' + esc(s.name) + (s.name !== s.host ? '<small>' + esc(s.host) + '</small>' : '') + '</a></li>';
    }).join('');
    document.getElementById('empty').hidden = sites.length > 0;
  }

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  // Called by the app once a page opened from here has loaded (after any redirect),
  // with its address and the site's own name: a new site goes to the top of the list.
  window.siteVisited = function (info) {
    var host = hostOf(info.url);
    if (!host) return;
    var name = (info.name || '').trim() || host;
    var known = sites.filter(function (s) { return s.host === host; })[0];
    if (known) {
      if (known.auto && known.name === known.host && name !== host) { known.name = name; saveSites(); render(); }
      return;
    }
    sites.unshift({ name: name, url: 'https://' + new URL(info.url).hostname + '/', host: host, auto: true });
    saveSites();
    render();
  };

  // ---- Swipe a row left for Delete; a long swipe deletes straight away. ----
  var drag = null;
  var openRow = null;
  var lastRemoved = null;
  var toastTimer = null;

  function slide(row, x, animate) {
    var a = row.querySelector('a');
    a.classList.toggle('dragging', !animate);
    a.style.transform = x ? 'translateX(' + x + 'px)' : '';
  }
  function closeOpenRow() {
    if (openRow) { slide(openRow, 0, true); openRow = null; }
  }
  function removeRow(row) {
    var i = +row.getAttribute('data-i');
    var site = sites[i];
    row.classList.add('gone');
    setTimeout(function () {
      sites.splice(i, 1);
      saveSites();
      render();
    }, 250);
    openRow = null;
    lastRemoved = { site: site, index: i };
    forgetRecipe(site.host);
    showToast('Removed ' + site.name);
  }
  function showToast(text) {
    document.getElementById('toast-text').textContent = text;
    document.getElementById('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { document.getElementById('toast').hidden = true; lastRemoved = null; }, 4000);
  }
  document.getElementById('undo').addEventListener('click', function () {
    if (!lastRemoved) return;
    sites.splice(Math.min(lastRemoved.index, sites.length), 0, lastRemoved.site);
    lastRemoved = null;
    saveSites();
    render();
    document.getElementById('toast').hidden = true;
  });
  // A deleted site forgets its saved lift choices too, so adding it back starts fresh.
  function forgetRecipe(host) {
    var cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
      cap.nativePromise('NewsJuiceBrowser', 'forgetSite', { host: host }).catch(function () {});
    }
  }

  list.addEventListener('touchstart', function (e) {
    var row = e.target.closest('.row');
    if (!row || e.target.closest('.del')) return;
    if (openRow && openRow !== row) closeOpenRow();
    var t = e.touches[0];
    drag = { row: row, x0: t.clientX, y0: t.clientY, dx: 0, base: row === openRow ? -88 : 0, horizontal: null };
  }, { passive: true });
  list.addEventListener('touchmove', function (e) {
    if (!drag) return;
    var t = e.touches[0];
    var dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
    if (drag.horizontal === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) drag.horizontal = Math.abs(dx) > Math.abs(dy);
    if (!drag.horizontal) return;
    e.preventDefault();
    drag.dx = dx;
    slide(drag.row, Math.min(0, drag.base + dx), false);
  }, { passive: false });
  list.addEventListener('touchend', function () {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (!d.horizontal) return;
    d.row.dataset.swiped = '1'; // the click that follows a swipe mustn't open the site
    var x = d.base + d.dx;
    var width = d.row.offsetWidth;
    if (x < -width * 0.55) { slide(d.row, -width, true); removeRow(d.row); }
    else if (x < -44) { slide(d.row, -88, true); openRow = d.row; }
    else { slide(d.row, 0, true); if (openRow === d.row) openRow = null; }
  });

  list.addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) return;
    e.preventDefault();
    if (e.target.closest('.del')) { removeRow(row); return; }
    if (row.dataset.swiped) { delete row.dataset.swiped; return; }
    if (openRow) { closeOpenRow(); return; } // a tap closes an open row rather than opening a site
    openURL(sites[+row.getAttribute('data-i')].url);
  });

  render();

  function openURL(url) {
    // No bundler here, so call the native bridge directly instead of registerPlugin().
    var cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
      cap.nativePromise('NewsJuiceBrowser', 'open', { url: url }).catch(function (e) { alert(e.message || e); });
    } else {
      location.href = url; // plain desktop browser, for poking at the page
    }
  }
  document.getElementById('go').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!field.value.trim()) { field.focus(); return; }
    var url = toURL(field.value);
    if (!url) {
      hint.textContent = /\s/.test(field.value.trim())
        ? 'Type a site or article address, like ndtv.com (searching isn’t supported yet).'
        : 'That doesn’t look like a web address. Try something like ndtv.com.';
      return;
    }
    hint.textContent = '';
    field.blur(); // put the keyboard away before the page opens
    openURL(url);
  });
  field.addEventListener('input', function () {
    clear.hidden = !field.value;
    hint.textContent = '';
  });
  clear.addEventListener('click', function () {
    field.value = '';
    clear.hidden = true;
    hint.textContent = '';
    field.focus();
  });
  // Put the keyboard away when something else is tapped. (Not on scroll or touchmove:
  // iOS scrolls the page itself to show a focused field, and taps jitter.)
  document.addEventListener('touchstart', function (e) {
    if (document.activeElement === field && !e.target.closest('form')) field.blur();
  }, { passive: true });
</script>
</body>
</html>
